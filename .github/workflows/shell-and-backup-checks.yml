name: Shell and backup-template checks

on:
  push:
    branches:
      - main
      - docs/phase-**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/backup-minecraft.sh
          bash -n tests/test-backup-template.sh
      - name: Run static backup-template checks
        run: bash tests/test-backup-template.sh
